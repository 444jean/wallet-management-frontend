<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wallet.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <title>Mi Billetera — Gastos, Ingresos y Ahorros</title>
    <script>
      // Apply the cached theme and palette before the first paint (no flash).
      // Keep the palette list and colors in sync with src/lib/palettes.ts.
      (function () {
        var colors = {
          purple: ["#4c1d95", "#7c3aed"],
          red: ["#b4123a", "#e5486a"],
          pink: ["#c2387a", "#f3a9cb"],
          green: ["#2f6b2a", "#2f8a3e"],
          amber: ["#b45a0c", "#f6b93f"],
        };
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("wallet-management:theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var p = localStorage.getItem("wallet-management:palette");
          if (!colors[p]) p = "purple";
          root.classList.toggle("dark", t === "dark");
          root.style.colorScheme = t;
          root.dataset.palette = p;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", colors[p][t === "dark" ? 1 : 0]);
        } catch (e) {
          root.classList.add("dark");
          root.dataset.palette = "purple";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
